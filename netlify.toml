[build]
  command = "npm run build"
  publish = "dist"

# The scheduled poller must not be reachable over public HTTP.
#
# Netlify serves every function at /.netlify/functions/<name>, scheduled ones
# included, and this one holds a container for ~45s of billed wall clock per
# call while hitting DexScreener, Twitch and Firestore. The scheduler invokes it
# internally and never crosses the CDN, so returning 404 here closes it to the
# outside world without affecting the cron. `force = true` is required or the
# function route wins. The function also self-guards (see its header) — this is
# the outer of two independent controls, not the only one.
#
# Verify after deploy: `curl -i https://csgn.fun/.netlify/functions/feePollerBackground`
# must return 404, and the fee poller must keep updating public/tokenStats.
[[redirects]]
  from = "/.netlify/functions/feePollerBackground"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # script-src/frame-src include www.google.com + www.gstatic.com for the
    # reCAPTCHA v3 loader used by Firebase App Check.
    #
    # connect-src DELIBERATELY LISTS NO SOLANA RPC OR TOKEN API.
    #
    # Every chain read — balances, the Meme 100's sources, coin lookups — goes
    # through our own functions and reaches the browser as same-origin JSON.
    # That is not an accident of implementation, it is the rule:
    #
    #   THE BROWSER NEVER TALKS TO A CHAIN OR A TOKEN API DIRECTLY.
    #
    # It was broken once, and expensively. `src/lib/csgnBalance.ts` POSTed to
    # api.mainnet-beta.solana.com from the page; this header blocked it; the
    # function's `catch { return 0 }` turned that block into a balance of zero
    # for every wallet on the site, for as long as the file existed. If you find
    # yourself wanting to add an RPC host here, add a function instead — one
    # reader, honest errors, and a CSP that stays narrow on a site that handles
    # wallet signatures.
    #
    # frame-src MUST list every clip platform. It listed youtube-nocookie only,
    # so a member could submit a TikTok or Instagram link, have it approved, and
    # watch it fail to render on air — the browser blocked the iframe and the
    # segment played as a blank rectangle. Two of the three platforms the
    # product advertises were unairable, and nothing anywhere reported it,
    # because a CSP block is a console warning rather than an error the app
    # sees. Any platform added to _shared/clipEmbed.ts has to be added here too.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://platform.twitter.com https://*.twimg.com https://embed.twitch.tv https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://platform.twitter.com https://*.twimg.com; img-src 'self' data: https:; media-src 'self' blob: https:; connect-src 'self' https://api.dexscreener.com https://*.firebaseapp.com https://*.googleapis.com https://*.twitch.tv wss://*.firebaseio.com https://cdn.syndication.twimg.com https://syndication.twitter.com; frame-src https://player.twitch.tv https://www.twitch.tv https://embed.twitch.tv https://www.youtube-nocookie.com https://www.youtube.com https://www.tiktok.com https://www.instagram.com https://instagram.com https://player.kick.com https://kick.com https://platform.twitter.com https://syndication.twitter.com https://x.com https://twitter.com https://www.google.com; font-src 'self' data: https://fonts.gstatic.com;"

[functions.feePollerBackground]
  schedule = "* * * * *"
