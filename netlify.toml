[build]
  command = "npm run build"
  publish = "dist"

# The scheduled poller must not be reachable over public HTTP.
#
# Netlify serves every function at /.netlify/functions/<name>, scheduled ones
# included, and this one holds a container for ~45s of billed wall clock per
# call while hitting DexScreener, Twitch and Firestore. The scheduler invokes it
# internally and never crosses the CDN, so returning 404 here closes it to the
# outside world without affecting the cron. `force = true` is required or the
# function route wins. The function also self-guards (see its header) — this is
# the outer of two independent controls, not the only one.
#
# Verify after deploy: `curl -i https://csgn.fun/.netlify/functions/feePollerBackground`
# must return 404, and the fee poller must keep updating public/tokenStats.
[[redirects]]
  from = "/.netlify/functions/feePollerBackground"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # script-src/frame-src include www.google.com + www.gstatic.com for the
    # reCAPTCHA v3 loader used by Firebase App Check.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://platform.twitter.com https://*.twimg.com https://embed.twitch.tv https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://platform.twitter.com https://*.twimg.com; img-src 'self' data: https:; media-src 'self' blob: https:; connect-src 'self' https://api.dexscreener.com https://*.firebaseapp.com https://*.googleapis.com https://*.twitch.tv wss://*.firebaseio.com https://cdn.syndication.twimg.com https://syndication.twitter.com; frame-src https://player.twitch.tv https://www.twitch.tv https://embed.twitch.tv https://www.youtube-nocookie.com https://player.kick.com https://kick.com https://platform.twitter.com https://syndication.twitter.com https://x.com https://twitter.com https://www.google.com; font-src 'self' data: https://fonts.gstatic.com;"

[functions.feePollerBackground]
  schedule = "* * * * *"
