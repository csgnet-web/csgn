<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CSGN PIP / Multi-Source Layouts</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  CSGN PIP / MULTI-SOURCE LAYOUTS — one transparent OBS Browser Source, 1920×1080,
  layered ABOVE your video sources. It draws the broadcast "furniture" (branded
  window frames, source labels, corner bug) around transparent windows; your
  video sources show THROUGH the windows. One file, every common permutation —
  a self-contained, dependency-free "quotable module" built to open-source.

  THE LAYOUTS  (switch with ?layout=… or press 1–9 live)
    1  solo        one full-frame source
    2  duo         two even, side by side
    3  duo-stack   two even, stacked (top / bottom)
    4  pip         one full background + one corner box   (?corner=tl|tr|bl|br)
    5  tri         one focus (left) + two even (stacked right)
    6  tri-top     one focus (top) + two even (bottom)
    7  quad        2 × 2 grid
    8  spotlight   one big center + two thin side rails
    9  solo-bug    full frame, brand bug only (no window chrome)

  HOW OBS COMPOSITES IT  (stack order, top → bottom)
    ┌ this file (csgn-pip.html)  ← frames + labels + bug, transparent windows
    ├ Video Source A, B, C…      ← position each to a window's rectangle
    └ (optional) a CSGN color/backdrop source to fill the gaps
    Use ?guide=1 to see each window's exact X / Y / W / H (in 1920×1080 space)
    and dial your OBS source Transform (Edit → Transform → Edit Transform…) to
    match. The windows are transparent, so the frame never covers the feed.

  INSTALL (OBS)
    Browser Source → ✅ Local file → this file
    Width 1920 · Height 1080 · position X 0, Y 0 · ON TOP of the video sources
    Custom CSS:  body { background: rgba(0,0,0,0); }
    One scene per layout: duplicate the source and give each a different
    ?layout=… URL, OR keep one source and press number keys to switch live.

  URL FLAGS
    ?layout=duo        initial layout (default: solo)
    ?corner=br         PIP corner for the "pip" layout (tl|tr|bl|br, default br)
    ?labels=Main,Host  comma-separated labels for the windows (blank = numbered)
    ?guide=1           setup mode: fill windows + print each rectangle's X/Y/W/H
    ?accent=%23ff2346  frame accent colour (URL-encoded hex; default CSGN red)
  ═══════════════════════════════════════════════════════════════════════════
-->
<style>
:root{ --accent:#ff2346; --ink:#fff; --muted:#c7c7cf; --frame:rgba(255,255,255,.14); }
*{box-sizing:border-box}
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:transparent;
  font-family:"Space Grotesk","Inter",system-ui,Arial,sans-serif;color:var(--ink)}
/* 16:9 stage; OBS renders it at exactly 1920×1080 so windows land pixel-true. */
.stage{position:absolute;inset:0}

/* A window = a transparent hole with a framed edge the video shows through. */
.win{position:absolute;border-radius:14px;border:2px solid var(--frame);
  box-shadow:0 0 0 1px rgba(0,0,0,.55), 0 22px 60px rgba(0,0,0,.45),
             inset 0 0 0 1px rgba(255,255,255,.05);
  overflow:hidden;pointer-events:none}
/* Top accent hairline so each source reads as "framed", not raw. */
.win::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.9}
/* Soft inner vignette so a bright feed doesn't bleed into the next window. */
.win::after{content:"";position:absolute;inset:0;border-radius:12px;
  box-shadow:inset 0 0 46px rgba(0,0,0,.35);pointer-events:none}
.win.focus{border-color:rgba(255,255,255,.22)}
.win.focus::before{opacity:1;height:4px}

/* Per-window label chip (top-left). */
.tag{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:8px;
  font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  background:rgba(8,8,12,.72);border:1px solid rgba(255,255,255,.14);
  border-radius:8px;padding:6px 12px;backdrop-filter:blur(4px);color:#fff}
.tag .live{width:9px;height:9px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 10px var(--accent);animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}

/* Fixed corner brand bug — always on, so viewers always see the channel. */
.bug{position:absolute;right:26px;bottom:22px;display:flex;align-items:center;gap:10px;
  font-weight:900;font-style:italic;font-size:26px;letter-spacing:.02em;color:#fff;
  background:rgba(8,8,12,.66);border:1px solid rgba(255,35,70,.5);border-radius:10px;
  padding:8px 14px;backdrop-filter:blur(4px);filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.bug b{color:var(--accent)}
.bug .n{font-style:normal;font-weight:800;font-size:13px;letter-spacing:.28em;color:var(--muted)}

/* Guide (setup) mode. */
.guide .win{background:rgba(255,35,70,.10);border-style:dashed;border-color:rgba(255,255,255,.4)}
.coords{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
  font-family:ui-monospace,"JetBrains Mono",monospace;font-size:22px;font-weight:700;
  color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.9);line-height:1.5;display:none}
.guide .coords{display:block}
.coords b{color:var(--accent)}
.legend{position:absolute;left:26px;top:22px;display:none;font-size:15px;color:var(--muted);
  background:rgba(8,8,12,.72);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 14px}
.guide .legend{display:block}
.legend b{color:#fff}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="bug">CS<b>G</b>N&nbsp;<span class="n">24/7</span></div>
<div class="legend" id="legend"></div>

<script>
/* ═══════════════ layout table — the single source of truth ═══════════════
   Rectangles are in 1920×1080 design space {x,y,w,h}; rendered as % so any
   16:9 surface (or OBS at native 1920×1080) lands them pixel-true. Read these
   numbers straight into your OBS source Transform when ?guide=1 is on. */
const M=40, G=24, W=1920, H=1080;              // outer margin, gap between windows
const evenW=(W-2*M-G)/2, fullH=H-2*M;          // 908 × 1000
const stackH=(H-2*M-G)/2;                       // 488
const rightW=600, focusW=W-2*M-G-rightW;        // tri: 1216 focus, 600 rail
const cellW=(W-2*M-G)/2, cellH=(H-2*M-G)/2;     // quad cell 908 × 488

const LAYOUTS={
  solo:      [{x:0,y:0,w:W,h:H}],
  duo:       [{x:M,y:M,w:evenW,h:fullH},{x:M+evenW+G,y:M,w:evenW,h:fullH}],
  'duo-stack':[{x:M,y:M,w:W-2*M,h:stackH},{x:M,y:M+stackH+G,w:W-2*M,h:stackH}],
  pip:       null, // built from ?corner below (full bg + corner box)
  tri:       [{x:M,y:M,w:focusW,h:fullH,focus:true},
              {x:M+focusW+G,y:M,w:rightW,h:stackH},
              {x:M+focusW+G,y:M+stackH+G,w:rightW,h:stackH}],
  'tri-top': [{x:M,y:M,w:W-2*M,h:640,focus:true},
              {x:M,y:M+640+G,w:evenW,h:H-2*M-640-G},
              {x:M+evenW+G,y:M+640+G,w:evenW,h:H-2*M-640-G}],
  quad:      [{x:M,y:M,w:cellW,h:cellH},{x:M+cellW+G,y:M,w:cellW,h:cellH},
              {x:M,y:M+cellH+G,w:cellW,h:cellH},{x:M+cellW+G,y:M+cellH+G,w:cellW,h:cellH}],
  spotlight: [{x:430,y:M,w:W-860,h:fullH,focus:true},
              {x:M,y:M,w:360,h:fullH},{x:W-M-360,y:M,w:360,h:fullH}],
  'solo-bug':[], // full frame, brand bug only — no window chrome
};
const ORDER=['solo','duo','duo-stack','pip','tri','tri-top','quad','spotlight','solo-bug'];

function pipRects(corner){
  const bw=520,bh=293,pad=40;                    // 16:9 corner box
  const x = corner.includes('l') ? pad : W-pad-bw;
  const y = corner.includes('t') ? pad : H-pad-bh;
  return [{x:0,y:0,w:W,h:H},{x,y,w:bw,h:bh,focus:true}];
}

const p=new URLSearchParams(location.search);
const GUIDE=p.has('guide');
const CORNER=(p.get('corner')||'br').toLowerCase();
const LABELS=(p.get('labels')||'').split(',').map(s=>s.trim()).filter(Boolean);
const accent=p.get('accent'); if(accent) document.documentElement.style.setProperty('--accent',accent);
if(GUIDE) document.body.classList.add('guide');

const stage=document.getElementById('stage');
const legend=document.getElementById('legend');
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function rectsFor(name){ return name==='pip' ? pipRects(CORNER) : (LAYOUTS[name]||[]); }

function render(name){
  const rects=rectsFor(name);
  stage.innerHTML = rects.map((r,i)=>{
    const label = LABELS[i] || (rects.length>1 ? `Source ${i+1}` : 'Live');
    const style = `left:${(r.x/W*100).toFixed(4)}%;top:${(r.y/H*100).toFixed(4)}%;`+
                  `width:${(r.w/W*100).toFixed(4)}%;height:${(r.h/H*100).toFixed(4)}%;`;
    return `<div class="win${r.focus?' focus':''}" style="${style}">
      <div class="tag"><span class="live"></span>${esc(label)}</div>
      <div class="coords"><b>${label}</b><br>X ${Math.round(r.x)} · Y ${Math.round(r.y)}<br>W ${Math.round(r.w)} · H ${Math.round(r.h)}</div>
    </div>`;
  }).join('');
  legend.innerHTML = `Layout <b>${esc(name)}</b> · ${rects.length} source${rects.length===1?'':'s'} · press 1–9 to switch · set each OBS source Transform to the X/Y/W/H shown`;
}

let current = (p.get('layout')||'solo').toLowerCase();
if(!ORDER.includes(current)) current='solo';
render(current);

/* Press 1–9 to switch layouts live (single-source setups). */
addEventListener('keydown',(e)=>{
  const n=parseInt(e.key,10);
  if(n>=1 && n<=ORDER.length){ current=ORDER[n-1]; render(current); }
});

/* Exposed for the repo smoke test / programmatic preview. */
window.__csgnPip={LAYOUTS,ORDER,rectsFor,pipRects,render,set:(n)=>{if(rectsFor(n))render(current=n)}};
</script>
</body>
</html>
