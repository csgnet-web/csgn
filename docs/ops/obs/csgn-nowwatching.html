<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CSGN Now Watching — Permanent Bug</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  CSGN "NOW WATCHING" — a PERMANENT lower-third bug (one transparent OBS Browser
  Source, 1920×1080). Unlike csgn-lowerthirds.html, this NEVER rotates away: it
  stays on screen the whole broadcast telling viewers what they're watching, and
  updates itself the instant the admin changes it. Use it as the always-on
  channel bug; use csgn-lowerthirds.html for the graphics that break in and out.

  ADMIN-CONTROLLED — reads the SAME world-readable doc as the ticker
  (config/ticker), the field:
      nowLive: { name, title }
  You set it from the app: Admin → Broadcast Control → "Now Live" (name + title).
  Saving it there flips config/ticker.onAirAuto off, so your custom label sticks
  until you turn auto-fill back on. Leave it on auto and it tracks the schedule's
  current show automatically. If nothing is set, this shows the network default
  (never blank), because a permanent bug should always say something.

  INSTALL (OBS)
    Browser Source → ✅ Local file → this file
    Width 1920 · Height 1080 · position X 0, Y 0 · ON TOP of the feed
    Custom CSS:  body { background: rgba(0,0,0,0); }
    Shutdown source when not visible: OFF.

  URL FLAGS
    ?pos=bl|br|tl|tr   corner (default bl — bottom-left, above the ticker)
    ?demo              show sample content immediately (setup / smoke shot)
    ?default=Name|Sub  override the "nothing set" fallback text
  ═══════════════════════════════════════════════════════════════════════════
-->
<style>
:root{ --accent:#ff2346; --ink:#fff; --muted:#c9c9d2; --panel:rgba(10,10,13,.90); }
*{box-sizing:border-box}
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:transparent;
  font-family:"Space Grotesk","Inter",system-ui,Arial,sans-serif;color:var(--ink)}
.bug{position:absolute;display:flex;align-items:stretch;
  filter:drop-shadow(0 14px 36px rgba(0,0,0,.55));
  opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.9,.2,1)}
.bug.show{opacity:1;transform:none}
/* corners (bl default sits above a bottom ticker) */
.pos-bl{left:64px;bottom:150px}
.pos-tl{left:64px;top:64px}
.pos-br{right:64px;bottom:150px;flex-direction:row-reverse}
.pos-tr{right:64px;top:64px;flex-direction:row-reverse}

.accent{width:12px;flex:none;background:linear-gradient(180deg,var(--accent),#7d1010);border-radius:5px}
.pos-bl .accent,.pos-tl .accent{border-radius:5px 0 0 5px}
.pos-br .accent,.pos-tr .accent{border-radius:0 5px 5px 0}
.body{background:var(--panel);border:1px solid rgba(255,255,255,.09);
  padding:18px 32px 20px;backdrop-filter:blur(4px);min-width:520px;max-width:1180px;border-radius:6px}
.pos-bl .body,.pos-tl .body{border-left:none;border-radius:0 8px 8px 0}
.pos-br .body,.pos-tr .body{border-right:none;border-radius:8px 0 0 8px}

.kick{display:flex;align-items:center;gap:13px;font-size:20px;font-weight:800;
  letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
.dot{width:13px;height:13px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 12px var(--accent);animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}
.name{font-size:52px;font-weight:900;font-style:italic;text-transform:uppercase;line-height:1;
  letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:1120px;
  transition:opacity .3s ease}
.sub{font-size:26px;font-weight:700;color:var(--muted);margin-top:9px;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:1120px;transition:opacity .3s ease}
.sub:empty{display:none}
.brand{position:absolute;top:-15px;font-weight:900;font-style:italic;font-size:19px;letter-spacing:.04em;
  color:#fff;background:#0c0c0e;border:1px solid rgba(255,35,70,.5);border-radius:6px;padding:4px 10px}
.pos-bl .brand,.pos-tl .brand{right:-12px} .pos-br .brand,.pos-tr .brand{left:-12px}
.brand b{color:var(--accent)}
.fade{opacity:0}
</style>
</head>
<body>
<div class="bug pos-bl" id="bug">
  <div class="accent"></div>
  <div class="body">
    <div class="brand">CS<b>G</b>N</div>
    <div class="kick"><span class="dot"></span><span id="kick">Now Watching on CSGN</span></div>
    <div class="name" id="name">CSGN</div>
    <div class="sub" id="sub"></div>
  </div>
</div>
<script>
const POLL_MS=10_000;
const FS_TICKER_URL="https://firestore.googleapis.com/v1/projects/csgn-ac44b/databases/(default)/documents/config/ticker";
const p=new URLSearchParams(location.search);
const DEMO=p.has("demo"), TEST=p.has("test");
const POS=(p.get("pos")||"bl").toLowerCase();
const [dName,dSub]=(p.get("default")||"CSGN|24/7 Crypto Sports & Gaming").split("|");

const bug=document.getElementById("bug");
const nameEl=document.getElementById("name"), subEl=document.getElementById("sub");
bug.className="bug pos-"+(["bl","br","tl","tr"].includes(POS)?POS:"bl");

/* Firestore REST value decoder (same shape the ticker + lower-thirds use). */
function decodeFs(v){
  if(!v||typeof v!=="object")return null;
  if("stringValue" in v)return v.stringValue;
  if("integerValue" in v)return Number(v.integerValue);
  if("booleanValue" in v)return Boolean(v.booleanValue);
  if("nullValue" in v)return null;
  if("mapValue" in v){const o={};for(const[k,val]of Object.entries(v.mapValue?.fields||{}))o[k]=decodeFs(val);return o}
  if("arrayValue" in v)return (v.arrayValue?.values||[]).map(decodeFs);
  return null;
}

let cur={name:"",title:""};
function apply(n){
  const name=(n&&n.name)?String(n.name):dName;
  const title=(n&&n.title)?String(n.title):(n?"":dSub||"");
  if(name===cur.name && title===cur.title) return;   // no change → don't re-animate
  cur={name,title};
  // brief crossfade so a change reads as a graphic, not a flicker
  nameEl.classList.add("fade"); subEl.classList.add("fade");
  setTimeout(()=>{
    nameEl.textContent=name; subEl.textContent=title;
    nameEl.classList.remove("fade"); subEl.classList.remove("fade");
  },220);
}

async function refresh(){
  try{
    const r=await fetch(FS_TICKER_URL,{cache:"no-store"});
    if(!r.ok)throw new Error(String(r.status));
    const f=(await r.json()).fields||{};
    const n=f.nowLive?decodeFs(f.nowLive):null;
    apply(n&&(n.name||n.title)?n:null);
  }catch{/* keep last good — a poll blip never blanks the permanent bug */}
}

/* Exposed for the repo smoke test. */
window.__csgnNow={decodeFs,apply};

if(DEMO){
  apply({name:"CSGN @ NITE",title:"Markets & Drama Whip-Around"});
  requestAnimationFrame(()=>bug.classList.add("show"));
}else if(!TEST){
  // Show immediately with the default, then let the first poll fill it in — the
  // bug is permanent, so it's on screen from frame one.
  nameEl.textContent=dName; subEl.textContent=dSub||""; cur={name:dName,title:dSub||""};
  requestAnimationFrame(()=>bug.classList.add("show"));
  refresh();
  setInterval(refresh,POLL_MS);
}
</script>
</body>
</html>
